name: Build Prompt Compressor

on:
  workflow_dispatch:
  push:
    branches:
      - kartikeya

jobs:
  build:
    name: Build (${{ matrix.os }})

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: prompt_compressor

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: prompt_compressor

      - name: Build Release
        run: cargo build --release

      - name: Upload Linux Binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: prompt-compressor-linux
          path: prompt_compressor/target/release/prompt_compressor
          if-no-files-found: error

      - name: Upload Windows Binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: prompt-compressor-windows
          path: prompt_compressor/target/release/prompt_compressor.exe
          if-no-files-found: error
